<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AI ChatWorks</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <h1>Reset Your Password</h1>
    <div id="status">Loading...</div>
    <div id="form" style="display:none;">
        <input type="password" id="password" placeholder="New password">
        <button onclick="resetPassword()">Reset</button>
    </div>

    <script>
        const supabase = window.supabase.createClient(
            'https://ldcapthzveqdbvthukiz.supabase.co',
            'sb_publishable_nIQj8SL9d_uaiWI3Urtzzg_9U6JEP_e'
        );

        // On page load
        window.addEventListener('load', async () => {
            console.log('URL:', window.location.href);

            // Check current session
            const { data: { session } } = await supabase.auth.getSession();
            console.log('Session:', session);

            if (session) {
                document.getElementById('status').textContent = 'Ready to reset password';
                document.getElementById('form').style.display = 'block';
            } else {
                document.getElementById('status').textContent = 'Invalid or expired link';
            }
        });

        async function resetPassword() {
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.updateUser({ password });

            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('Password reset successfully!');
            }
        }
    </script>
</body>

</html>
